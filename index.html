<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Подписание Акта ООО «СНТ»</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #1a2b4c;
            user-select: none;
            -webkit-user-select: none;
        }
        h3 {
            margin: 0 0 4px 0;
            text-align: center;
            font-size: 17px;
        }
        p.subtitle {
            margin: 0 0 12px 0;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }
        .section {
            background: #ffffff;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0f172a;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }
        input[type="text"]:focus {
            border-color: #2563eb;
        }
        .canvas-box {
            position: relative;
            width: 100%;
            height: 150px;
            background: #ffffff;
            border: 2px dashed #94a3b8;
            border-radius: 8px;
            margin-top: 8px;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: crosshair;
        }
        .clear-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 8px;
            font-size: 13px;
            font-weight: 600;
            color: #ef4444;
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: #10b981;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
    </style>
</head>
<body>
    <h3>Приёмка работ ООО «СНТ»</h3>
    <p class="subtitle">Электронное подписание акта</p>

    <!-- 1. Заказчик -->
    <div class="section">
        <div class="section-title">1. Представитель Заказчика</div>
        <input type="text" id="clientName" placeholder="ФИО представителя (напр. Иванов И.И.)">
        <div style="margin-top: 10px; font-size: 13px; color: #475569;">Подпись Заказчика (пальцем на экране):</div>
        <div class="canvas-box">
            <canvas id="clientCanvas"></canvas>
        </div>
        <div class="clear-btn" onclick="clearPad('client')">Очистить подпись</div>
    </div>

    <!-- 2. Монтажник -->
    <div class="section">
        <div class="section-title">2. Подпись Монтажника (ООО «СНТ»)</div>
        <div class="canvas-box">
            <canvas id="installerCanvas"></canvas>
        </div>
        <div class="clear-btn" onclick="clearPad('installer')">Очистить подпись</div>
    </div>

    <button class="btn-submit" onclick="submitData()">Сохранить и отправить Акт</button>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.disableVerticalSwipes) {
                tg.disableVerticalSwipes();
            }
        }

        const clientCanvas = document.getElementById('clientCanvas');
        const installerCanvas = document.getElementById('installerCanvas');

        let signedClient = false;
        let signedInst = false;

        function setupCanvas(canvas, onDrawCallback) {
            const ctx = canvas.getContext('2d');

            function resize() {
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#0f172a';
            }

            resize();
            window.addEventListener('resize', resize);

            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            canvas.addEventListener('pointerdown', (e) => {
                isDrawing = true;
                canvas.setPointerCapture(e.pointerId);
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(lastX + 0.1, lastY + 0.1);
                ctx.stroke();
                onDrawCallback();
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!isDrawing) return;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            });

            function endDrawing(e) {
                if (!isDrawing) return;
                isDrawing = false;
                try {
                    canvas.releasePointerCapture(e.pointerId);
                } catch (err) {}
            }

            canvas.addEventListener('pointerup', endDrawing);
            canvas.addEventListener('pointercancel', endDrawing);
        }

        setupCanvas(clientCanvas, () => { signedClient = true; });
        setupCanvas(installerCanvas, () => { signedInst = true; });

        function clearPad(type) {
            if (type === 'client') {
                const ctx = clientCanvas.getContext('2d');
                ctx.clearRect(0, 0, clientCanvas.width, clientCanvas.height);
                signedClient = false;
            } else {
                const ctx = installerCanvas.getContext('2d');
                ctx.clearRect(0, 0, installerCanvas.width, installerCanvas.height);
                signedInst = false;
            }
        }

        function submitData() {
            const name = document.getElementById('clientName').value.trim();
            if (!name) {
                alert("Пожалуйста, введите ФИО представителя Заказчика!");
                return;
            }
            if (!signedClient) {
                alert("Пожалуйста, поставьте подпись Заказчика!");
                return;
            }
            if (!signedInst) {
                alert("Пожалуйста, поставьте подпись Монтажника!");
                return;
            }

            const clientSignBase64 = clientCanvas.toDataURL('image/png');
            const instSignBase64 = installerCanvas.toDataURL('image/png');

            if (tg && tg.initData) {
                try {
                    tg.sendData(JSON.stringify({
                        action: "full_signature",
                        client_name: name,
                        client_sign: clientSignBase64,
                        installer_sign: instSignBase64
                    }));
                    tg.close();
                    return;
                } catch(e) {}
            }

            alert("Подписи сохранены! Закройте окно крестиком вверху слева.");
            if (tg) {
                tg.close();
            }
        }
    </script>
</body>
</html>
