<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Подпись Акта ООО «СНТ»</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            touch-action: none;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h3 {
            margin: 0 0 4px 0;
            color: #1a2b4c;
            font-size: 16px;
        }
        .header p {
            margin: 0;
            color: #666;
            font-size: 13px;
        }
        .canvas-container {
            width: 100%;
            flex-grow: 1;
            background: #ffffff;
            border: 2px dashed #99aab5;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 8px;
        }
        .hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #c0c4cc;
            font-size: 15px;
            pointer-events: none;
            user-select: none;
        }
        .controls {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-top: 12px;
            margin-bottom: 6px;
        }
        button {
            flex: 1;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        .btn-clear {
            background-color: #e2e8f0;
            color: #334155;
        }
        .btn-save {
            background-color: #10b981;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>Приёмка работ ООО «СНТ»</h3>
        <p>Распишитесь пальцем или стилусом на поле ниже</p>
    </div>
    <div class="canvas-container">
        <canvas id="signCanvas"></canvas>
        <div id="hintText" class="hint">Место для подписи Заказчика</div>
    </div>
    <div class="controls">
        <button class="btn-clear" onclick="clearPad()">Очистить</button>
        <button class="btn-save" onclick="sendSignature()">Подтвердить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('signCanvas');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hintText');
        let isDrawing = false;
        let hasSigned = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#0f172a';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startSign(e) {
            isDrawing = true;
            hasSigned = true;
            hint.style.display = 'none';
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function drawSign(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function stopSign() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startSign);
        canvas.addEventListener('mousemove', drawSign);
        window.addEventListener('mouseup', stopSign);

        canvas.addEventListener('touchstart', startSign, {passive: false});
        canvas.addEventListener('touchmove', drawSign, {passive: false});
        window.addEventListener('touchend', stopSign);

        function clearPad() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hint.style.display = 'block';
            hasSigned = false;
        }

        function sendSignature() {
            if (!hasSigned) {
                alert("Пожалуйста, поставьте подпись перед отправкой!");
                return;
            }
            const dataUrl = canvas.toDataURL('image/png');
            tg.sendData(JSON.stringify({ action: "client_signature", image: dataUrl }));
            tg.close();
        }
    </script>
</body>
</html>
